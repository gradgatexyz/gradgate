[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gradgate"
version = "0.1.0"
description = "An open-source terminal for Pons launches on Robinhood Chain: every launch read in the block it lands, strategies as rules, paper by default."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.52.4",
  "web3==8.0.0",
  "eth_abi==6.0.0",
  "eth-account==0.14.0",
  "websockets==17.1",
  "pillow==12.3.0",
  "psycopg[binary]==3.3.5",
  "rich>=13.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
gradgate = "gradgate.cli:main"

[tool.setuptools]
packages = ["gradgate"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Homepage = "https://gradgate.xyz"
Repository = "https://github.com/gradgatexyz/gradgate"
